---
# promtail - per-host log shipper feeding Loki on Hawkeye.
#
# Hawkeye already runs Loki + the Grafana Loki datasource. This role installs
# the agent side on each source host so logs actually flow in. Installed from
# the Grafana apt repo (same source the hawkeye role uses for promtail/loki).
#
# These hosts run journald, NOT rsyslog (/var/log/syslog is an empty leftover),
# so the systemd journal is the single real log source. promtail reads
# /var/log/journal, which requires both persistent journald storage AND
# promtail being in the systemd-journal group, both enforced below BEFORE the
# readiness check.

# ---------------------------------------------------------------------------
# Persistent journald: the journal must be on disk at /var/log/journal (not
# volatile /run/log/journal) so it survives reboots and so promtail's journal
# reader has a stable path. Also captures per-user journals (OpenClaw's --user
# gateway service).
# ---------------------------------------------------------------------------
- name: Ensure persistent journald storage directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    group: systemd-journal
    mode: "2755"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Configure journald for persistent storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    mode: "0644"
    content: |
      # Managed by Ansible (promtail role)
      [Journal]
      Storage=persistent
  register: journald_conf

- name: Restart journald if storage mode changed
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  when: journald_conf is changed

# ---------------------------------------------------------------------------
# Grafana apt repo + promtail package (idempotent; matches hawkeye role).
# ---------------------------------------------------------------------------
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - curl
    state: present
    update_cache: yes

- name: Add Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/trusted.gpg.d/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: "deb [signed-by=/etc/apt/trusted.gpg.d/grafana.asc] https://apt.grafana.com stable main\n"
  register: grafana_repo

- name: Update apt cache after adding Grafana repo
  ansible.builtin.apt:
    update_cache: yes
  when: grafana_repo.changed

- name: Install promtail
  ansible.builtin.apt:
    name: promtail
    state: present

# ---------------------------------------------------------------------------
# promtail user/group. The apt package creates the promtail user but not a
# same-named primary `promtail` group, so chown to group=promtail fails. Create
# the group idempotently, then a create-only user task that also adds promtail
# to systemd-journal (required to READ /var/log/journal), tolerating the
# 'currently used by process' refusal when the service is already running.
- name: Ensure promtail group exists
  ansible.builtin.group:
    name: promtail
    system: yes

- name: Ensure promtail user exists + is in required groups
  ansible.builtin.user:
    name: promtail
    group: promtail
    groups: systemd-journal
    append: yes
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
  register: promtail_user
  failed_when:
    - promtail_user is failed
    - "'is currently used by process' not in (promtail_user.msg | default(''))"

- name: Ensure promtail positions/state directory exists
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0755"

# ---------------------------------------------------------------------------
# The packaged promtail systemd unit runs as User=promtail with a hardened
# sandbox. Add a drop-in to guarantee it has the SupplementaryGroups and read
# access needed for the journal (some packaged units set DynamicUser/strict
# sandboxing that drops the systemd-journal group at runtime).
# ---------------------------------------------------------------------------
- name: Ensure promtail systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/promtail.service.d
    state: directory
    mode: "0755"

- name: Grant promtail journal read access via systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/promtail.service.d/10-journal-access.conf
    mode: "0644"
    content: |
      # Managed by Ansible (promtail role)
      # Ensure the promtail process can read the systemd journal.
      [Service]
      SupplementaryGroups=systemd-journal
      # Relax any DynamicUser so the static promtail user + group membership
      # actually applies (DynamicUser would ignore our systemd-journal add).
      DynamicUser=no
  register: promtail_dropin

# ---------------------------------------------------------------------------
# Config
# ---------------------------------------------------------------------------
- name: Deploy promtail config
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/config.yml
    owner: promtail
    group: promtail
    mode: "0644"
  register: promtail_config

# ---------------------------------------------------------------------------
# Restart NOW (not via end-of-play handler) so the new group membership, drop-in
# and config are live before the readiness check below.
# ---------------------------------------------------------------------------
- name: Reload systemd + restart promtail to apply journal access and config
  ansible.builtin.systemd:
    name: promtail
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Wait for promtail to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ promtail_http_port }}/ready"
    status_code: 200
  register: promtail_ready
  until: promtail_ready.status == 200
  retries: 10
  delay: 3
