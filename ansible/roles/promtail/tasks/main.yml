---
# promtail - per-host log shipper feeding Loki on Hawkeye.
#
# Hawkeye already runs Loki + the Grafana Loki datasource. This role installs
# the agent side on each source host so logs actually flow in. Installed from
# the Grafana apt repo (same source the hawkeye role uses for promtail/loki).

# ---------------------------------------------------------------------------
# Persistent journald: required so the journal survives reboots AND so the
# per-user journal (OpenClaw's `--user` service) is written under
# /var/log/journal where promtail's journal scraper can read it. Volatile-only
# journald (/run/log/journal) would lose user logs and reset on reboot.
# ---------------------------------------------------------------------------
# Persistent journald is only relevant when we actually read the journal
# (promtail_read_journal=true) - e.g. the OpenClaw VM. Skipped elsewhere so we
# don't touch journald config on hosts that only tail /var/log/syslog.
- name: Ensure persistent journald storage directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    mode: "2755"
  when: promtail_read_journal | default(false)

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  when: promtail_read_journal | default(false)

- name: Configure journald for persistent storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    mode: "0644"
    content: |
      # Managed by Ansible (promtail role)
      [Journal]
      Storage=persistent
  register: journald_conf
  when: promtail_read_journal | default(false)

- name: Restart journald if storage mode changed
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  when:
    - promtail_read_journal | default(false)
    - journald_conf is changed

# ---------------------------------------------------------------------------
# Grafana apt repo + promtail package (idempotent; matches hawkeye role).
# ---------------------------------------------------------------------------
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
      - curl
    state: present
    update_cache: yes

- name: Add Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/trusted.gpg.d/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: "deb [signed-by=/etc/apt/trusted.gpg.d/grafana.asc] https://apt.grafana.com stable main\n"
  register: grafana_repo

- name: Update apt cache after adding Grafana repo
  ansible.builtin.apt:
    update_cache: yes
  when: grafana_repo.changed

- name: Install promtail
  ansible.builtin.apt:
    name: promtail
    state: present

# ---------------------------------------------------------------------------
# promtail user/group. The apt package creates the promtail user (uid varies),
# but does NOT reliably create a same-named primary `promtail` group, so any
# chown to group=promtail fails with 'failed to look up group promtail'. Same
# class of bug as the loki user earlier: never assume the package made the
# user/group, and never let the `user` module modify a live service account
# (usermod refuses while the service is running).
#
# So: guarantee the group idempotently, then a create-only user task that also
# adds promtail to its group + systemd-journal (to read the journal), tolerating
# the 'currently used by process' refusal when the service is already running.
- name: Ensure promtail group exists
  ansible.builtin.group:
    name: promtail
    system: yes

- name: Ensure promtail user exists + is in required groups
  ansible.builtin.user:
    name: promtail
    group: promtail
    groups: systemd-journal
    append: yes
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
  register: promtail_user
  failed_when:
    - promtail_user is failed
    - "'is currently used by process' not in (promtail_user.msg | default(''))"
  notify: Restart promtail

- name: Ensure promtail positions/state directory exists
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0755"

# ---------------------------------------------------------------------------
# Config
# ---------------------------------------------------------------------------
- name: Deploy promtail config
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: /etc/promtail/config.yml
    owner: promtail
    group: promtail
    mode: "0644"
  notify: Restart promtail

- name: Enable + start promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: yes
    state: started
    daemon_reload: yes

# ---------------------------------------------------------------------------
# Verify the agent is up locally. (We don't assert Loki ingestion here to keep
# the role self-contained; Loki reachability is verified in the run notes.)
# ---------------------------------------------------------------------------
- name: Wait for promtail to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ promtail_http_port }}/ready"
    status_code: 200
  register: promtail_ready
  until: promtail_ready.status == 200
  retries: 6
  delay: 3
