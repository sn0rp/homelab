---
# Actual Budget runs on port 5006 inside the LXC (installed by the
# community-scripts ct/actualbudget.sh as a systemd unit `actualbudget`).
# This role only manages the service state + an nginx TLS reverse proxy on
# finance.snorp.dev, exactly like the searxng role. The app itself is
# installed by the community script (bare-metal recovery) or the PXE firstboot.

# The community script enables HTTPS inside Actual itself (an `https` block in
# config.json with a self-signed cert), so the app speaks TLS on 5006. In our
# design nginx is the sole TLS terminator and must proxy plain HTTP to the
# backend, so we strip the `https` block and let Actual serve plaintext on
# localhost. Without this, nginx->app is HTTP-to-a-TLS-socket => 502.
- name: Disable Actual's built-in HTTPS (nginx terminates TLS instead)
  copy:
    dest: /opt/actualbudget-data/config.json
    content: |
      {
        "port": {{ actualbudget_port }},
        "hostname": "127.0.0.1",
        "serverFiles": "/opt/actualbudget-data/server-files",
        "userFiles": "/opt/actualbudget-data/user-files",
        "trustedProxies": [
          "127.0.0.0/8",
          "::1/128"
        ]
      }
    backup: yes
  notify: Restart actualbudget

# Apply the config change now so the port check below sees the HTTP listener.
- name: Flush handlers (restart Actual before health check)
  meta: flush_handlers

# Actual's sync-server returns an empty reply to a bare `GET /` (it only
# answers real browser requests / its API routes), so an HTTP status probe
# gives a false negative. Gate on the TCP port being open instead - that is
# the real "is the service up" signal.
- name: Wait for Actual Budget port to be listening
  wait_for:
    host: 127.0.0.1
    port: "{{ actualbudget_port }}"
    state: started
    timeout: 120
    delay: 2

- name: Ensure Actual Budget service is enabled and started
  systemd:
    name: actualbudget
    enabled: yes
    state: started

- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Create cert directory
  file:
    path: /etc/nginx/certs
    state: directory

- name: Copy wildcard cert into the Actual Budget LXC
  command: "{{ item }}"
  loop:
    - pct push {{ actualbudget_lxc_id }} /etc/pve/local/certs/fullchain.pem /etc/nginx/certs/fullchain.pem
    - pct push {{ actualbudget_lxc_id }} /etc/pve/local/certs/privkey.pem /etc/nginx/certs/privkey.pem
  delegate_to: proxmox

- name: Configure nginx reverse proxy for Actual Budget (HTTP -> HTTPS + proxy)
  copy:
    dest: /etc/nginx/sites-available/actualbudget
    content: |
      server {
          listen 80 default_server;
          server_name finance.snorp.dev;
          return 301 https://$host$request_uri;
      }
      server {
          listen 443 ssl default_server;
          server_name finance.snorp.dev;
          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;

          # Actual's sync + file upload can be large; lift nginx's default 1m cap.
          client_max_body_size 100M;

          location / {
              proxy_pass http://127.0.0.1:{{ actualbudget_port }};
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
  notify: Reload nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/actualbudget
    dest: /etc/nginx/sites-enabled/actualbudget
    state: link
  notify: Reload nginx

- name: Remove nginx default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is enabled and started
  systemd:
    name: nginx
    enabled: yes
    state: started
