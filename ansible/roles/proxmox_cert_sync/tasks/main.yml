---
# proxmox_cert_sync: pulls the wildcard cert off the issuer (Technitium LXC) and
# fans it out to every consumer declared in cert_distribution_targets.
#
# Design goals (2026-11-08 rewrite):
#   * No VPS dependency. The cert is issued locally on Technitium via DNS-01 and
#     pulled over the LAN with `pct pull` - no internet round-trip, no scp from
#     a public host that might be dead (that was the Oct 2026 nightly failure).
#   * Data-driven. Adding an HTTPS consumer - including a FUTURE VPS - is a
#     one-line entry in cert_distribution_targets. No bespoke per-host tasks.
#   * Honest, attributable failures. The old unit chained ~18 commands with &&,
#     so one dead host hung 135s and reported nothing useful. The new unit loops
#     per target with short connect timeouts and logs which target failed, while
#     still exiting nonzero so Hawkeye alerts on a real problem.
#
# This role installs a systemd service+timer on the Proxmox host. The host is the
# orchestrator because it already has `pct` access to the LXCs and holds the
# pve-ssl cert itself.

- name: Ensure cert staging dir exists on proxmox
  file:
    path: "{{ proxmox_cert_dir }}"
    state: directory
    mode: "0700"

- name: Render cert distribution script
  template:
    src: cert-sync.sh.j2
    dest: /usr/local/sbin/cert-sync.sh
    mode: "0750"
    owner: root
    group: root
  notify: Reload systemd

- name: Install cert-sync systemd service
  copy:
    dest: /etc/systemd/system/cert-sync.service
    content: |
      [Unit]
      Description=Pull TLS wildcard from the issuer and fan out to all consumers
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/cert-sync.sh
  notify: Reload systemd

- name: Install cert-sync systemd timer
  copy:
    dest: /etc/systemd/system/cert-sync.timer
    content: |
      [Unit]
      Description=Daily cert sync from the issuer
      [Timer]
      OnCalendar=daily
      Persistent=true
      RandomizedDelaySec=300
      [Install]
      WantedBy=timers.target
  notify: Reload systemd

- name: Enable cert-sync timer
  systemd:
    name: cert-sync.timer
    enabled: yes
    state: started
    daemon_reload: yes
