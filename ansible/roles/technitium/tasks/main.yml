---
- name: Wait for Technitium to be reachable
  uri:
    url: "http://{{ ansible_host }}:5380/api/user/login"
    method: GET
    status_code: [200, 400]
  register: result
  until: result.status in [200, 400]
  retries: 12
  delay: 10

- name: Get API token
  uri:
    url: "http://{{ ansible_host }}:5380/api/user/login"
    method: POST
    body_format: form-urlencoded
    body:
      user: admin
      pass: "{{ technitium_admin_password }}"
      includeInfo: "false"
  register: login
  no_log: false #temporary

- name: Set API token fact
  set_fact:
    tech_token: "{{ login.json.token }}"
  no_log: true

- name: Set Cloudflare DoH forwarder
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      forwarders: "{{ technitium_forwarders | join(',') }}"
      forwarderProtocol: Https

- name: Configure blocking settings (general)
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      enableBlocking: "true"
      blockingType: NxDomain
      blockListUpdateIntervalHours: "24"

# Technitium expects blockListUrls as repeated form fields, one per URL.
# A newline-joined single string is stored as one invalid URL and silently
# disables all blocking (enableBlocking stays true but the list is empty).
# We build the raw urlencoded body so each URL is its own blockListUrls field.
- name: Set block list URLs (one repeated field per URL)
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/set"
    method: POST
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: >-
      token={{ tech_token | urlencode }}&{{
      technitium_blocklist_urls
      | map('urlencode')
      | map('regex_replace', '^', 'blockListUrls=')
      | join('&') }}
  register: blocklist_result
  failed_when: blocklist_result.json.status | default('error') != 'ok'

- name: Force immediate block list download after URL change
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/forceUpdateBlockLists?token={{ tech_token }}"
    method: GET
    status_code: 200
  register: update_result
  failed_when: update_result.json.status | default('error') != 'ok'

- name: Create snorp.dev primary zone
  uri:
    url: "http://{{ ansible_host }}:5380/api/zones/create"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      zone: "{{ base_domain }}"
      type: Primary
  register: zone_result
  failed_when:
    - zone_result.status != 200
    - '"already exists" not in (zone_result.json.errorMessage | default(""))'

- name: Add DNS A records
  uri:
    url: "http://{{ ansible_host }}:5380/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      zone: "{{ base_domain }}"
      domain: "{{ item.name }}.{{ base_domain }}"
      type: "{{ item.type }}"
      ipAddress: "{{ item.value }}"
      ttl: "3600"
      overwrite: "true"
  loop: "{{ technitium_dns_records }}"

- name: Enable HTTPS on Technitium
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      webServiceEnableTls: "true"
      webServiceHttpsPort: "53443"
      webServiceTlsCertificatePath: "{{ technitium_pfx_path }}"
      webServiceTlsCertificatePassword: ""

- name: Block ad/tracking domains not covered by upstream lists
  # Gaps found via https://paileactivist.github.io/toolz/adblock.html test (2026-06-14)
  # Technitium's Blocked zone type covers the zone root and all subdomains, so
  # these entries catch domains/parents missing from the Hagezi list entirely.
  # Skipped intentionally: widgets.pinterest.com (breaks embedded content),
  #   d.reddit.com (Reddit CDN - breaks Reddit)
  uri:
    url: "http://{{ ansible_host }}:5380/api/zones/create"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      zone: "{{ item }}"
      type: Blocked
  register: custom_block_result
  failed_when:
    - custom_block_result.status != 200
    - '"already exists" not in (custom_block_result.json.errorMessage | default(""))'
  loop:
    - "ads.google.com"
    - "doubleclick.net"
    - "ads.reddit.com"
    - "data.mistat.xiaomi.com"
    - "data.mistat.intl.xiaomi.com"
    - "data.mistat.india.xiaomi.com"
    - "data.mistat.rus.xiaomi.com"
    - "tracking.india.miui.com"
    - "tracking.rus.miui.com"

- name: Enable DoH
  uri:
    url: "http://{{ ansible_host }}:5380/api/settings/set"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ tech_token }}"
      enableDnsOverHttp: "true"