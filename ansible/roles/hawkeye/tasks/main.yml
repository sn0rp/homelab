---
# Hawkeye - monitoring stack + Spectrum outage classifier.
#
# Components:
#   - Prometheus            (metrics TSDB + scraper)        :9090
#   - Alertmanager          (alert routing -> ntfy)         :9093
#   - blackbox_exporter     (reachability probes)           :9115
#   - Grafana               (dashboards, LAN-visible)       :3000
#   - Loki + Promtail       (logs, for the broader homelab goal)  :3100
#   - isp-gateway-discovery (writes current Spectrum gateway for the probe)
#
# The Spectrum WAN gateway is NOT hardcoded. A timer discovers it as the
# first hop toward 1.1.1.1 and writes it into a file-based service-discovery
# target that blackbox/Prometheus pick up. Self-healing if Spectrum renumbers.

- name: Install prerequisites
  apt:
    name:
      - curl
      - wget
      - tar
      - traceroute
      - apt-transport-https
      - gnupg
    state: present
    update_cache: yes

# ---------------------------------------------------------------------------
# Prometheus, Alertmanager, blackbox_exporter  (upstream binaries + systemd)
# ---------------------------------------------------------------------------
- name: Create prometheus system user
  ansible.builtin.user:
    name: prometheus
    system: yes
    shell: /usr/sbin/nologin
    home: "{{ prom_install_dir }}"
    create_home: no

- name: Create install + data + config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - "{{ prom_install_dir }}"
    - "{{ prom_install_dir }}/bin"
    - /etc/prometheus
    - /etc/prometheus/rules
    - /etc/prometheus/targets
    - /etc/alertmanager
    - /etc/blackbox_exporter
    - /var/lib/prometheus
    - /var/lib/alertmanager

- name: Download + unpack Prometheus
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.{{ prometheus_arch }}.tar.gz"
    dest: "{{ prom_install_dir }}"
    remote_src: yes
    extra_opts: ["--strip-components=1", "--wildcards", "*/prometheus", "*/promtool"]
    creates: "{{ prom_install_dir }}/prometheus"
  notify: Restart prometheus

- name: Place prometheus + promtool on PATH
  ansible.builtin.copy:
    remote_src: yes
    src: "{{ prom_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - prometheus
    - promtool

- name: Download + unpack Alertmanager
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: ["--strip-components=1", "--wildcards", "*/alertmanager", "*/amtool"]
    creates: /usr/local/bin/alertmanager
  notify: Restart alertmanager

- name: Download + unpack blackbox_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_version }}/blackbox_exporter-{{ blackbox_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: ["--strip-components=1", "--wildcards", "*/blackbox_exporter"]
    creates: /usr/local/bin/blackbox_exporter
  notify: Restart blackbox_exporter

# ---------------------------------------------------------------------------
# Config files
# ---------------------------------------------------------------------------
- name: Deploy blackbox_exporter config
  ansible.builtin.copy:
    src: blackbox.yml
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart blackbox_exporter

- name: Deploy static probe targets (router LAN + public anchors)
  ansible.builtin.template:
    src: targets_static.yml.j2
    dest: /etc/prometheus/targets/static.yml
    owner: prometheus
    group: prometheus
    mode: "0644"

- name: Deploy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Reload prometheus

- name: Deploy alert/classification rules
  ansible.builtin.template:
    src: outage_rules.yml.j2
    dest: /etc/prometheus/rules/outage.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Reload prometheus

- name: Deploy infra (Proxmox + NAS hardware) alert rules
  ansible.builtin.template:
    src: infra_rules.yml.j2
    dest: /etc/prometheus/rules/infra.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Reload prometheus

- name: Deploy Alertmanager config (routes to ntfy)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart alertmanager

# ---------------------------------------------------------------------------
# systemd units
# ---------------------------------------------------------------------------
- name: Deploy systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - prometheus.service
    - alertmanager.service
    - blackbox_exporter.service
  notify:
    - Restart prometheus
    - Restart alertmanager
    - Restart blackbox_exporter

# ---------------------------------------------------------------------------
# Dynamic Spectrum gateway discovery (no router agent)
# ---------------------------------------------------------------------------
# The discovery script SSHes to the router (read-only `ip route`) to learn the
# current Spectrum gateway. Hawkeye needs its own key authorized on the router.
- name: Generate Hawkeye SSH keypair for router gateway reads
  ansible.builtin.user:
    name: root
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
  register: hawkeye_sshkey

- name: Read Hawkeye public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: hawkeye_pubkey

# GL.iNet/OpenWRT uses dropbear; authorized_keys lives at /etc/dropbear/.
- name: Authorize Hawkeye key on the router (read-only gateway discovery)
  ansible.builtin.raw: |
    KEY='{{ hawkeye_pubkey['content'] | b64decode | trim }}'
    grep -qF "$KEY" /etc/dropbear/authorized_keys 2>/dev/null || echo "$KEY" >> /etc/dropbear/authorized_keys
  delegate_to: "{{ router_lan_ip }}"
  vars:
    ansible_user: root
    ansible_python_interpreter: /bin/false

- name: Deploy gateway-discovery script
  ansible.builtin.template:
    src: discover-isp-gateway.sh.j2
    dest: /usr/local/bin/discover-isp-gateway.sh
    mode: "0755"

- name: Deploy gateway-discovery systemd service + timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - isp-gateway-discovery.service
    - isp-gateway-discovery.timer
  notify: Restart isp-gateway-discovery

- name: Run gateway discovery once immediately
  ansible.builtin.command: /usr/local/bin/discover-isp-gateway.sh
  changed_when: false

- name: Enable + start gateway-discovery timer
  ansible.builtin.systemd:
    name: isp-gateway-discovery.timer
    enabled: yes
    state: started
    daemon_reload: yes

# ---------------------------------------------------------------------------
# Grafana + Loki + Promtail  (official Grafana apt repo)
# ---------------------------------------------------------------------------
- name: Add Grafana apt signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/trusted.gpg.d/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: "deb [signed-by=/etc/apt/trusted.gpg.d/grafana.asc] https://apt.grafana.com stable main\n"
  register: grafana_repo

- name: Update apt cache after adding Grafana repo
  apt:
    update_cache: yes
  when: grafana_repo.changed

# Loki + Grafana live here; promtail (the log shipper) is NOT installed by this
# role. Promtail is applied to every host - including Hawkeye itself - by the
# dedicated `promtail` role, so the whole fleet ships logs identically with a
# consistent `host` label. See site.yml.
- name: Install Grafana + Loki
  apt:
    name:
      - grafana
      - loki
    state: present

# Explicit Loki config: bind on all interfaces so LAN promtail agents (Proxmox,
# LXCs, OpenClaw VM - see promtail role) can push, and pin retention. We manage
# this rather than relying on the apt package default so ingestion is
# deterministic and version-controlled.
- name: Ensure Loki data directory exists
  ansible.builtin.file:
    path: /var/lib/loki
    state: directory
    owner: loki
    group: loki
    mode: "0755"

- name: Deploy Loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: /etc/loki/config.yml
    owner: loki
    group: loki
    mode: "0644"
  notify: Restart loki

- name: Configure Grafana Prometheus + Loki datasources (provisioning)
  ansible.builtin.template:
    src: grafana_datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/hawkeye.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

# ---------------------------------------------------------------------------
# graphite_exporter  (TrueNAS metrics: TrueNAS pushes Graphite -> we scrape)
# ---------------------------------------------------------------------------
# TrueNAS Community Edition does not expose Prometheus metrics natively; it
# pushes collectd/Graphite. graphite_exporter receives that carbon stream on
# 2003 and re-exposes it as Prometheus metrics on 9108, remapped via a mapping
# config. Enable it in TrueNAS: System > Reporting > set destination to
# hawkeye:2003 (Graphite).
- name: Create graphite_exporter system user
  ansible.builtin.user:
    name: graphite_exporter
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Download + unpack graphite_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/graphite_exporter/releases/download/v{{ graphite_exporter_version }}/graphite_exporter-{{ graphite_exporter_version }}.{{ prometheus_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: ["--strip-components=1", "--wildcards", "*/graphite_exporter"]
    creates: /usr/local/bin/graphite_exporter

- name: Deploy graphite_exporter mapping config
  ansible.builtin.template:
    src: graphite_mapping.yml.j2
    dest: /etc/graphite_exporter_mapping.yml
    owner: graphite_exporter
    group: graphite_exporter
    mode: "0644"
  notify: Restart graphite_exporter

- name: Deploy graphite_exporter systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/graphite_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Graphite exporter (TrueNAS metrics bridge)
      Wants=network-online.target
      After=network-online.target
      [Service]
      User=graphite_exporter
      Group=graphite_exporter
      Type=simple
      ExecStart=/usr/local/bin/graphite_exporter \
        --graphite.mapping-config=/etc/graphite_exporter_mapping.yml \
        --graphite.listen-address=:{{ graphite_carbon_port }} \
        --web.listen-address=:{{ graphite_metrics_port }}
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
  notify: Restart graphite_exporter

- name: Ensure all services enabled + started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
    daemon_reload: yes
  loop:
    - blackbox_exporter
    - prometheus
    - alertmanager
    - grafana-server
    - loki
    - graphite_exporter

- name: Wait for Prometheus to be healthy
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:9090/-/healthy"
    status_code: 200
  register: prom_health
  until: prom_health.status == 200
  retries: 12
  delay: 5

# --- TLS front for Grafana (nginx + wildcard cert, fleet convention) ---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create nginx cert directory
  ansible.builtin.file:
    path: /etc/nginx/certs
    state: directory

- name: Copy wildcard cert to Hawkeye LXC (pushed from Proxmox host)
  ansible.builtin.command: "{{ item }}"
  loop:
    - pct push 103 /etc/pve/local/certs/fullchain.pem /etc/nginx/certs/fullchain.pem
    - pct push 103 /etc/pve/local/certs/privkey.pem /etc/nginx/certs/privkey.pem
  delegate_to: proxmox

- name: Configure nginx reverse proxy for Grafana (HTTPS)
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/grafana
    content: |
      server {
          listen 80 default_server;
          server_name hawkeye.snorp.dev;
          return 301 https://$host$request_uri;
      }
      server {
          listen 443 ssl default_server;
          server_name hawkeye.snorp.dev;
          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;
          location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          # Grafana Live (websockets) for live panels
          location /api/live/ {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $host;
          }
      }
  notify: Reload nginx

- name: Enable Grafana nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/grafana
    dest: /etc/nginx/sites-enabled/grafana
    state: link
  notify: Reload nginx

- name: Remove nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Set Grafana root_url so redirects use HTTPS hostname
  ansible.builtin.copy:
    dest: /etc/grafana/grafana.ini
    content: |
      # Managed by Ansible (hawkeye role)
      [server]
      domain = hawkeye.snorp.dev
      root_url = https://hawkeye.snorp.dev/
      enforce_domain = false
  register: grafana_ini
  notify: Restart grafana

- name: Restart Grafana now if config changed (apply before TLS check)
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
  when: grafana_ini is changed

# Reload nginx unconditionally so Grafana's :443 TLS front is up immediately,
# not deferred to end-of-play (and not skipped on an unchanged re-apply).
- name: Reload nginx now so Grafana HTTPS is served
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Wait for Grafana HTTPS to be reachable
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}/api/health"
    validate_certs: false
    status_code: 200
  register: grafana_https
  until: grafana_https.status == 200
  retries: 6
  delay: 5
