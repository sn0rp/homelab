---
# nas_watchdog: runs on Hawkeye, SSHes to the TrueNAS box as a low-priv user,
# calls midclt for pool health + disk temps, and pushes edge-triggered alerts
# to ntfy. Covers the safety-critical NAS signals that the netdata Graphite
# stream does NOT carry: ZFS pool degradation (the loose SATA power cable) and
# Ironwolf disk temperature.

# Dedicated TrueNAS user for the Hawkeye watchdog. TrueNAS allows only one SSH
# key per user, so a separate 'hawkeye' user holds Hawkeye's key (rather than
# sharing the human 'snorp' user's single key slot).
nas_ssh_user: "hawkeye"
nas_ssh_host: "{{ nas_ip }}"          # 192.168.8.204 from group_vars
nas_ssh_key: /root/.ssh/id_ed25519     # reuse Hawkeye's existing key (same as router discovery)

# ntfy topic for NAS hardware health - SEPARATE from spectrum-outage so a
# degraded mirror is not confused with an ISP outage. Subscribe the phone to it.
nas_ntfy_topic: "nas-health"

# Ironwolf thresholds (Seagate datasheet: >60C not recommended sustained).
nas_disk_temp_warn: 55
nas_disk_temp_crit: 60

# How often the watchdog runs.
nas_watchdog_interval: "*:0/5"         # every 5 minutes

# State file for edge-triggering (only notify on transitions).
nas_watchdog_state: /var/lib/nas_watchdog/state.json
