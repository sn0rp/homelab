---
# nas_watchdog: Hawkeye-side ZFS-health + disk-temp watchdog for the TrueNAS box.
# Runs on the hawkeye host (same place as Prometheus/Alertmanager).

# --- Ensure Hawkeye has an SSH keypair (reuse the one made for router discovery) ---
- name: Ensure Hawkeye SSH keypair exists
  ansible.builtin.user:
    name: root
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519

- name: Read Hawkeye public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: hawkeye_pub

# Seed the NAS host key into known_hosts BEFORE any SSH to the NAS, so the
# fetch/update tasks below are non-interactive on a fresh Hawkeye.
- name: Pre-seed NAS host key into Hawkeye known_hosts
  ansible.builtin.shell: >
    touch /root/.ssh/known_hosts;
    ssh-keyscan -H {{ nas_ssh_host }} >> /root/.ssh/known_hosts 2>/dev/null;
    sort -u /root/.ssh/known_hosts -o /root/.ssh/known_hosts
  changed_when: false

# --- BOOTSTRAP NOTE -------------------------------------------------------
# The tasks below SSH to the NAS as {{ nas_ssh_user }} using Hawkeye's key.
# On the VERY FIRST run that key must already be authorized on the TrueNAS
# {{ nas_ssh_user }} user, otherwise these fail with publickey denied. Do the
# one-time bootstrap (add Hawkeye's pubkey to the snorp user's SSH keys in the
# TrueNAS UI, or via an existing working SSH session). After that, this role
# keeps the key set managed idempotently. Hawkeye's pubkey is shown at the end
# of a failed run via the assertion below.
- name: Verify Hawkeye can SSH to the NAS (bootstrap gate)
  ansible.builtin.command: >
    ssh -i {{ nas_ssh_key }} -o BatchMode=yes -o ConnectTimeout=10
    -o StrictHostKeyChecking=accept-new
    {{ nas_ssh_user }}@{{ nas_ssh_host }} true
  register: nas_ssh_probe
  changed_when: false
  failed_when: false

- name: Stop with bootstrap instructions if Hawkeye key not yet authorized
  ansible.builtin.fail:
    msg: |
      Hawkeye cannot SSH to the NAS as {{ nas_ssh_user }} yet (publickey).
      ONE-TIME BOOTSTRAP: add this Hawkeye public key to the TrueNAS
      {{ nas_ssh_user }} user's SSH keys (Credentials > Local Users > edit >
      Authorized Keys), then re-run:

        {{ hawkeye_pub.content | b64decode | trim }}
  when: nas_ssh_probe.rc != 0

# --- Authorize/keep that key on the TrueNAS 'snorp' user via midclt ---
# TrueNAS owns authorized_keys; we set keys through user.update, not by editing
# the file. Fetch the user's current sshpubkey, append ours if absent, write the
# merged set back. (After the one-time bootstrap above, this keeps it managed.)
- name: Fetch current snorp sshpubkey from TrueNAS
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
    {{ nas_ssh_user }}@{{ nas_ssh_host }}
    midclt call user.query '[["username","=","{{ nas_ssh_user }}"]]'
  register: nas_user_q
  changed_when: false

- name: Compute merged authorized key set
  ansible.builtin.set_fact:
    nas_existing_pubkey: "{{ (nas_user_q.stdout | from_json)[0].sshpubkey | default('') }}"
    hawkeye_pubkey_line: "{{ hawkeye_pub.content | b64decode | trim }}"

- name: Authorize Hawkeye key on TrueNAS snorp user (idempotent, preserves existing)
  ansible.builtin.command: >
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
    {{ nas_ssh_user }}@{{ nas_ssh_host }}
    midclt call user.update {{ (nas_user_q.stdout | from_json)[0].id }}
    '{{ {"sshpubkey": (nas_existing_pubkey ~ "\n" ~ hawkeye_pubkey_line) | trim} | to_json }}'
  when: hawkeye_pubkey_line not in nas_existing_pubkey
  register: nas_key_auth
  changed_when: nas_key_auth.rc == 0

# --- Deploy the watchdog ---
- name: Create watchdog state dir
  ansible.builtin.file:
    path: "{{ nas_watchdog_state | dirname }}"
    state: directory
    mode: "0755"

- name: Deploy nas_watchdog script
  ansible.builtin.template:
    src: nas_watchdog.py.j2
    dest: /usr/local/bin/nas_watchdog.py
    mode: "0755"

- name: Deploy nas_watchdog systemd service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: nas_watchdog.service
      content: |
        [Unit]
        Description=TrueNAS ZFS health + disk temp watchdog (-> ntfy)
        Wants=network-online.target
        After=network-online.target
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/nas_watchdog.py
    - name: nas_watchdog.timer
      content: |
        [Unit]
        Description=Run TrueNAS watchdog periodically
        [Timer]
        OnCalendar={{ nas_watchdog_interval }}
        Persistent=true
        [Install]
        WantedBy=timers.target
  notify: Reload systemd

- name: Run watchdog once immediately (seeds state, sends nothing if all healthy)
  ansible.builtin.command: /usr/local/bin/nas_watchdog.py
  changed_when: false

- name: Enable + start watchdog timer
  ansible.builtin.systemd:
    name: nas_watchdog.timer
    enabled: yes
    state: started
    daemon_reload: yes
