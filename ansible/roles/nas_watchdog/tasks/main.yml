---
# nas_watchdog: Hawkeye-side ZFS-health + disk-temp watchdog for the TrueNAS box.
# Runs on the hawkeye host (same place as Prometheus/Alertmanager).

# --- Ensure Hawkeye has an SSH keypair (reuse the one made for router discovery) ---
- name: Ensure Hawkeye SSH keypair exists
  ansible.builtin.user:
    name: root
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519

- name: Read Hawkeye public key
  ansible.builtin.slurp:
    src: /root/.ssh/id_ed25519.pub
  register: hawkeye_pub

# Seed the NAS host key into known_hosts BEFORE any SSH to the NAS, so the
# fetch/update tasks below are non-interactive on a fresh Hawkeye.
- name: Pre-seed NAS host key into Hawkeye known_hosts
  ansible.builtin.shell: >
    touch /root/.ssh/known_hosts;
    ssh-keyscan -H {{ nas_ssh_host }} >> /root/.ssh/known_hosts 2>/dev/null;
    sort -u /root/.ssh/known_hosts -o /root/.ssh/known_hosts
  changed_when: false

# --- BOOTSTRAP NOTE -------------------------------------------------------
# The tasks below SSH to the NAS as {{ nas_ssh_user }} using Hawkeye's key.
# On the VERY FIRST run that key must already be authorized on the TrueNAS
# {{ nas_ssh_user }} user, otherwise these fail with publickey denied. Do the
# one-time bootstrap (add Hawkeye's pubkey to the snorp user's SSH keys in the
# TrueNAS UI, or via an existing working SSH session). After that, this role
# keeps the key set managed idempotently. Hawkeye's pubkey is shown at the end
# of a failed run via the assertion below.
- name: Verify Hawkeye can SSH to the NAS (bootstrap gate)
  ansible.builtin.command: >
    ssh -i {{ nas_ssh_key }} -o BatchMode=yes -o ConnectTimeout=10
    -o StrictHostKeyChecking=accept-new
    {{ nas_ssh_user }}@{{ nas_ssh_host }} true
  register: nas_ssh_probe
  changed_when: false
  failed_when: false

- name: Stop with bootstrap instructions if Hawkeye key not yet authorized
  ansible.builtin.fail:
    msg: |
      Hawkeye cannot SSH to the NAS as {{ nas_ssh_user }} yet (publickey).
      ONE-TIME BOOTSTRAP: create/edit the dedicated TrueNAS '{{ nas_ssh_user }}'
      user (Credentials > Local Users), give it shell access + midclt rights,
      and paste this Hawkeye public key into its Authorized Keys, then re-run:

        {{ hawkeye_pub.content | b64decode | trim }}
  when: nas_ssh_probe.rc != 0

# Verify the watchdog user can actually run the midclt calls it needs. A fresh
# non-root TrueNAS user may be denied privileged middleware methods; catch that
# here with a clear message rather than silent watchdog failures later.
- name: Verify the NAS user can run required midclt calls
  ansible.builtin.command: >
    ssh -i {{ nas_ssh_key }} -o BatchMode=yes -o ConnectTimeout=10
    {{ nas_ssh_user }}@{{ nas_ssh_host }}
    midclt call disk.temperatures
  register: nas_midclt_probe
  changed_when: false
  failed_when: false

- name: Stop if the NAS user cannot run midclt
  ansible.builtin.fail:
    msg: |
      The TrueNAS '{{ nas_ssh_user }}' user connected over SSH but could not run
      'midclt call disk.temperatures'. Grant it the needed privileges (e.g. add
      to a group with middleware access) and re-run. Output:
      {{ nas_midclt_probe.stdout }} {{ nas_midclt_probe.stderr }}
  when: nas_midclt_probe.rc != 0

# NOTE: SSH key management is intentionally NOT done here. TrueNAS allows one
# key per user, so the key lives on a dedicated '{{ nas_ssh_user }}' user,
# managed in the TrueNAS UI. The role only consumes that access.

# --- node_exporter on Hawkeye (textfile-only) to serve NAS temps + health ---
# The netdata Graphite stream carries no disk temps / pool health, so the
# watchdog writes them as Prometheus textfile metrics and a local node_exporter
# exposes them for scraping. This makes NAS temps + ZFS health graphable.
- name: Create node_exporter system user (Hawkeye)
  ansible.builtin.user:
    name: node_exporter
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Create textfile collector directory (Hawkeye)
  ansible.builtin.file:
    path: "{{ nas_textfile_dir }}"
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0775"

- name: Download + unpack node_exporter (Hawkeye)
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ hawkeye_node_exporter_version }}/node_exporter-{{ hawkeye_node_exporter_version }}.linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: ["--strip-components=1", "--wildcards", "*/node_exporter"]
    creates: /usr/local/bin/node_exporter

- name: Deploy node_exporter systemd unit (Hawkeye, textfile-focused)
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus node_exporter (Hawkeye)
      Wants=network-online.target
      After=network-online.target
      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=:{{ hawkeye_node_exporter_port }} \
        --collector.textfile.directory={{ nas_textfile_dir }}
      Restart=on-failure
      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Enable + start node_exporter (Hawkeye)
  ansible.builtin.systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes

# --- Deploy the watchdog ---
- name: Create watchdog state dir
  ansible.builtin.file:
    path: "{{ nas_watchdog_state | dirname }}"
    state: directory
    mode: "0755"

- name: Deploy nas_watchdog script
  ansible.builtin.template:
    src: nas_watchdog.py.j2
    dest: /usr/local/bin/nas_watchdog.py
    mode: "0755"

- name: Deploy nas_watchdog systemd service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: nas_watchdog.service
      content: |
        [Unit]
        Description=TrueNAS ZFS health + disk temp watchdog (-> ntfy)
        Wants=network-online.target
        After=network-online.target
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/nas_watchdog.py
    - name: nas_watchdog.timer
      content: |
        [Unit]
        Description=Run TrueNAS watchdog periodically
        [Timer]
        OnCalendar={{ nas_watchdog_interval }}
        Persistent=true
        [Install]
        WantedBy=timers.target
  notify: Reload systemd

- name: Run watchdog once immediately (seeds state, sends nothing if all healthy)
  ansible.builtin.command: /usr/local/bin/nas_watchdog.py
  changed_when: false

- name: Enable + start watchdog timer
  ansible.builtin.systemd:
    name: nas_watchdog.timer
    enabled: yes
    state: started
    daemon_reload: yes
