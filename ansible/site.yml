# ansible/site.yml
---
- name: VPS - wildcard cert
  hosts: vps_hosts
  vars_files:
    - vault.yml
  roles:
    - role: vps_cert
      tags: cert, vps

- name: Proxmox host - cert sync
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: proxmox_cert_sync
      tags: cert, proxmox

- name: Proxmox host - monitoring exporters
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: node_exporter
      tags: monitoring, node_exporter, proxmox
    - role: pve_exporter
      tags: monitoring, pve_exporter, proxmox

- name: Technitium LXC
  hosts: technitium
  vars_files:
  - vault.yml
  roles:
    - role: technitium
      tags: technitium

- name: Provisioning LXC
  hosts: provisioning
  vars_files:
  - vault.yml
  roles:
    - role: provisioning
      tags: provisioning

- name: Router
  hosts: router_hosts
  gather_facts: false
  roles:
    - role: router
      tags: router

- name: SearXNG
  hosts: searxng
  gather_facts: true
  vars_files:
    - vault.yml
  roles:
    - role: searxng
      tags: searxng

- name: OpenClaw VM
  hosts: openclaw
  vars_files:
    - vault.yml
  roles:
    - role: openclaw
      tags: openclaw

- name: ntfy LXC (alert path)
  hosts: ntfy
  vars_files:
    - vault.yml
  roles:
    - role: ntfy
      tags: ntfy

- name: Hawkeye monitoring LXC
  hosts: hawkeye
  vars_files:
    - vault.yml
  roles:
    - role: hawkeye
      tags: hawkeye