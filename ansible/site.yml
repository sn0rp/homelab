# ansible/site.yml
---
- name: VPS - wildcard cert
  hosts: vps_hosts
  vars_files:
    - vault.yml
  roles:
    - role: vps_cert
      tags: cert, vps

- name: Proxmox host - cert sync
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: proxmox_cert_sync
      tags: cert, proxmox

- name: Proxmox host - monitoring exporters
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: node_exporter
      tags: monitoring, node_exporter, proxmox
    - role: pve_exporter
      tags: monitoring, pve_exporter, proxmox
    - role: promtail
      tags: monitoring, promtail, logs, proxmox
      vars:
        promtail_host_label: proxmox

- name: Technitium LXC
  hosts: technitium
  vars_files:
  - vault.yml
  roles:
    - role: technitium
      tags: technitium

- name: Provisioning LXC
  hosts: provisioning
  vars_files:
  - vault.yml
  roles:
    - role: provisioning
      tags: provisioning

- name: Router
  hosts: router_hosts
  gather_facts: false
  roles:
    - role: router
      tags: router

- name: SearXNG
  hosts: searxng
  gather_facts: true
  vars_files:
    - vault.yml
  roles:
    - role: searxng
      tags: searxng

- name: OpenClaw VM
  hosts: openclaw
  vars_files:
    - vault.yml
  roles:
    - role: openclaw
      tags: openclaw

# Authorize the OpenClaw box's own key on the rest of the fleet so the agent can
# run ssh / ansible / terraform against these hosts. This is a dedicated
# per-host identity (mentor@openclaw.snorp.dev), NOT Benj's personal key, so
# revoking it just means dropping one line from authorized_keys. Runs against
# every SSH-reachable host except the openclaw box itself and the dropbear
# router.
- name: Authorize OpenClaw agent SSH key on the fleet
  hosts: vps_hosts:proxmox_hosts:lxc_hosts:!openclaw
  gather_facts: false
  tags: openclaw_ssh
  tasks:
    - name: Ensure /root/.ssh exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root
    - name: Add OpenClaw agent key to root authorized_keys
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ openclaw_agent_ssh_pubkey }}"
        create: yes
        mode: '0600'
        owner: root
        group: root
        state: present

- name: Hawkeye monitoring LXC
  hosts: hawkeye
  vars_files:
    - vault.yml
  roles:
    - role: hawkeye
      tags: hawkeye
    - role: nas_watchdog
      tags: hawkeye, nas_watchdog, monitoring

# ---------------------------------------------------------------------------
# Log shipping: promtail on every host that produces logs worth keeping.
# Loki + Grafana's Loki datasource live in the hawkeye role above; this is the
# agent side feeding them. The `host` label per agent matches the `host:`
# label convention of the Prometheus scrape jobs, so metrics and logs join on
# the same host name in Grafana. The Proxmox host gets promtail in its own play
# above. TrueNAS is intentionally excluded (it pushes Graphite metrics; its
# logs add little here).
- name: Log shippers - LXCs + OpenClaw VM + Hawkeye
  hosts: technitium:provisioning:searxng:openclaw:hawkeye
  vars_files:
    - vault.yml
  roles:
    - role: promtail
      tags: monitoring, promtail, logs
      vars:
        promtail_host_label: "{{ inventory_hostname }}"