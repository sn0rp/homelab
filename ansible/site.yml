# ansible/site.yml
---
- name: VPS - wildcard cert
  hosts: vps_hosts
  vars_files:
    - vault.yml
  roles:
    - role: vps_cert
      tags: cert, vps

- name: Proxmox host - cert sync
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: proxmox_cert_sync
      tags: cert, proxmox

- name: Proxmox host - monitoring exporters
  hosts: proxmox_hosts
  vars_files:
    - vault.yml
  roles:
    - role: node_exporter
      tags: monitoring, node_exporter, proxmox
    - role: pve_exporter
      tags: monitoring, pve_exporter, proxmox
    - role: promtail
      tags: monitoring, promtail, logs, proxmox
      vars:
        promtail_host_label: proxmox

- name: Technitium LXC
  hosts: technitium
  vars_files:
  - vault.yml
  roles:
    - role: technitium
      tags: technitium

- name: Provisioning LXC
  hosts: provisioning
  vars_files:
  - vault.yml
  roles:
    - role: provisioning
      tags: provisioning

- name: Router
  hosts: router_hosts
  gather_facts: false
  roles:
    - role: router
      tags: router

- name: SearXNG
  hosts: searxng
  gather_facts: true
  vars_files:
    - vault.yml
  roles:
    - role: searxng
      tags: searxng

- name: OpenClaw VM
  hosts: openclaw
  vars_files:
    - vault.yml
  roles:
    - role: openclaw
      tags: openclaw

- name: ntfy LXC (alert path)
  hosts: ntfy
  vars_files:
    - vault.yml
  roles:
    - role: ntfy
      tags: ntfy

- name: Hawkeye monitoring LXC
  hosts: hawkeye
  vars_files:
    - vault.yml
  roles:
    - role: hawkeye
      tags: hawkeye
    - role: nas_watchdog
      tags: hawkeye, nas_watchdog, monitoring

# ---------------------------------------------------------------------------
# Log shipping: promtail on every host that produces logs worth keeping.
# Loki + Grafana's Loki datasource live in the hawkeye role above; this is the
# agent side feeding them. The `host` label per agent matches the `host:`
# label convention of the Prometheus scrape jobs, so metrics and logs join on
# the same host name in Grafana. The Proxmox host gets promtail in its own play
# above. TrueNAS is intentionally excluded (it pushes Graphite metrics; its
# logs add little here).
- name: Log shippers - LXCs + Hawkeye (syslog only)
  hosts: technitium:provisioning:searxng:ntfy:hawkeye
  vars_files:
    - vault.yml
  roles:
    - role: promtail
      tags: monitoring, promtail, logs
      vars:
        promtail_host_label: "{{ inventory_hostname }}"

# OpenClaw VM: also read the journal, because its gateway runs as a `--user`
# systemd service whose logs are journal-only (not in /var/log/syslog). It is a
# full VM, not an unprivileged LXC, so the journal is readable.
- name: Log shipper - OpenClaw VM (syslog + journal)
  hosts: openclaw
  vars_files:
    - vault.yml
  roles:
    - role: promtail
      tags: monitoring, promtail, logs
      vars:
        promtail_host_label: openclaw
        promtail_read_journal: true