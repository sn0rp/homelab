---
# OpenClaw agent's own SSH public key (mentor@openclaw.snorp.dev). Authorized on
# the fleet by the "openclaw_ssh" play so the agent can run ssh/ansible/terraform.
# Public key only - safe to keep in plaintext, not vaulted. Revoke by removing
# this line from each host's authorized_keys.
openclaw_agent_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFkTNwLhJRYimENDF7UQUme/LnxtonUmm3V4mPZWGjxl mentor@openclaw.snorp.dev"

# Domain and network
base_domain: snorp.dev
# vps_ip: 216.128.143.17  # RETIRED Nov 2026 - VPS destroyed (compromised). No
# homelab function depends on a VPS now; the wildcard is issued locally on
# Technitium via DNS-01. Re-add when a future VPS comes online.
technitium_ip: 192.168.8.104
proxmox_ip: 192.168.8.187
nas_ip: 192.168.8.204
nas_smb_username: snorp
nas_smb_share: documents
provisioning_ip: 192.168.8.180
searxng_ip: 192.168.8.139
openclaw_ip: 192.168.8.140
hawkeye_ip: 192.168.8.113
actualbudget_ip: 192.168.8.214

# --- Outage monitor / ISP probe targets ---
# router LAN gateway (internal-alive anchor) - genuinely static
router_lan_ip: 192.168.8.1
# Public anchors for upstream/peering probe - static
public_anchors:
  - 1.1.1.1
  - 8.8.8.8
# NOTE: the Spectrum WAN gateway (currently 98.26.78.1) is NOT hardcoded.
# It is discovered dynamically as the first hop toward 1.1.1.1 (see hawkeye role).

# --- Alert delivery: Discord webhooks ---
# MIGRATED OFF ntfy 2026-07-10 (no phone app, works off-network). Alertmanager
# posts to Discord via native discord_configs. The two webhook URLs live in
# vault.yml (discord_outage_webhook / discord_logs_webhook) - they are secrets
# (anyone with the URL can post to the channel), so they are NOT committed here.
# They may point at the same channel/webhook or two separate ones.
#
# The old ntfy LXC (104), role, DNS record, and topic vars were removed
# 2026-07-10; nothing routes to ntfy anymore.

# --- Observability exporters (Proxmox + NAS) ---
# node_exporter + pve_exporter run on the Proxmox host; graphite_exporter runs
# on Hawkeye to receive TrueNAS Graphite pushes. Scraped by Prometheus.
pve_exporter_user: "monitoring@pve"
pve_exporter_token_name: "exporter"
# pve_exporter_token_secret is supplied via vault.yml (created on first run).
searxng_port: 8888
actualbudget_port: 5006
technitium_lxc_id: 100
provisioning_lxc_id: 101
searxng_lxc_id: 102
actualbudget_lxc_id: 104

openclaw_searxng_url: "http://searx.snorp.dev:8888"

# --- TLS wildcard: issuance + distribution -----------------------------------
# One wildcard (*.snorp.dev + snorp.dev) is issued ONCE on the issuer host via
# Let's Encrypt DNS-01 (Cloudflare), then fanned out to every consumer by the
# proxmox cert-sync unit. DNS-01 needs no inbound ports, so the issuer can be
# any host that reaches the Cloudflare API - we use the Technitium LXC (our DNS
# box). The VPS that used to do this was destroyed Nov 2026; nothing here needs
# a VPS anymore.
certbot_cert_name: snorp.dev-0001
certbot_cert_dir: "/etc/letsencrypt/live/{{ certbot_cert_name }}"
cloudflare_ini_path: /root/.cloudflare.ini
proxmox_cert_dir: /etc/pve/local/certs
technitium_pfx_path: /etc/technitium/technitium.pfx

# Which host issues/renews the cert. Technitium LXC = our DNS box.
cert_issuer_lxc_id: "{{ technitium_lxc_id }}"

# Every HTTPS consumer of the wildcard. The cert-sync script loops over this, so
# adding a site is a ONE-LINE entry here - no new role, no new ACME account.
#
# kind:
#   local - cp into a path on the proxmox host itself, then run reload
#   lxc   - pct push PEMs into an LXC (by id), then pct exec reload
#   pfx   - pct push the PKCS12 bundle into an LXC, then pct exec reload
#   ssh   - scp PEMs to a remote host (LAN or a future VPS), then ssh reload
#
# FUTURE VPS: when you stand one up for a personal site, give it HTTPS on this
# same wildcard by adding one entry, e.g.:
#   - { name: "mysite-vps", kind: ssh, host: "203.0.113.10", ssh_user: root,
#       dir: /etc/nginx/certs,
#       fullchain: /etc/nginx/certs/fullchain.pem,
#       privkey: /etc/nginx/certs/privkey.pem,
#       reload: "systemctl reload nginx" }
# Prereqs for an ssh target: proxmox's root key is authorized on it, and its
# firewall allows SSH from the proxmox WAN egress. That's it.
cert_distribution_targets:
  - { name: "technitium", kind: pfx, lxc_id: "{{ technitium_lxc_id }}",
      pfx: "{{ technitium_pfx_path }}",
      reload: "systemctl restart technitium" }
  - { name: "proxmox-ui", kind: local,
      fullchain: /etc/pve/local/pve-ssl.pem,
      privkey: /etc/pve/local/pve-ssl.key,
      reload: "systemctl restart pveproxy" }
  - { name: "searxng", kind: lxc, lxc_id: "{{ searxng_lxc_id }}",
      dir: /etc/nginx/certs,
      fullchain: /etc/nginx/certs/fullchain.pem,
      privkey: /etc/nginx/certs/privkey.pem,
      reload: "systemctl reload nginx" }
  # NOTE: the OpenClaw box is intentionally NOT a push target here. It is the
  # agent host, so we keep the hypervisor out of it - instead it self-serves via
  # the cert_pull role (it SSHes the issuer and pulls its own cert). See the
  # "OpenClaw VM - self-service cert pull" play in site.yml.

# --- cert_pull: hosts that pull their own cert from the issuer ----------------
# For hosts that should not accept an inbound push (the agent box). They SSH the
# issuer directly. Defaults target the OpenClaw box's nginx.
cert_pull_issuer_host: "{{ technitium_ip }}"
cert_pull_issuer_user: root
cert_pull_dir: /etc/nginx/certs
cert_pull_fullchain: /etc/nginx/certs/fullchain.pem
cert_pull_privkey: /etc/nginx/certs/privkey.pem
cert_pull_owner: root
cert_pull_group: root
cert_pull_reload: "systemctl reload nginx"

# Technitium
# NOTE: @ / www / * used to point at the (now-destroyed) VPS. There is no public
# apex/www site yet, so they resolve to proxmox on the LAN just so the wildcard
# points somewhere real. When a future VPS hosts the public site, repoint @/www
# (and optionally *) at that VPS's public IP - one edit here.
technitium_dns_records:
  - { name: "@",            type: A, value: "{{ proxmox_ip }}" }
  - { name: "www",          type: A, value: "{{ proxmox_ip }}" }
  - { name: "*",            type: A, value: "{{ proxmox_ip }}" }
  - { name: "technitium",   type: A, value: "{{ technitium_ip }}" }
  - { name: "proxmox",      type: A, value: "{{ proxmox_ip }}" }
  - { name: "provisioning", type: A, value: "{{ provisioning_ip }}" }
  - { name: "searx",        type: A, value: "{{ searxng_ip }}" }
  - { name: "openclaw",     type: A, value: "{{ openclaw_ip }}" }
  - { name: "nas",          type: A, value: "{{ nas_ip }}" }
  - { name: "hawkeye",      type: A, value: "{{ hawkeye_ip }}" }
  - { name: "finance",      type: A, value: "{{ actualbudget_ip }}" }

technitium_forwarders:
  - https://cloudflare-dns.com/dns-query
  - https://dns.quad9.net/dns-query
  - https://dns.google/dns-query

# Block lists. Technitium's API takes blockListUrls as REPEATED form fields,
# one per URL - NOT a single newline-joined string. Joining with \n stores one
# mangled URL and silently disables all blocking. See technitium role.
technitium_blocklist_urls:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi-onlydomains.txt
