---
# OpenClaw agent's own SSH public key (mentor@openclaw.snorp.dev). Authorized on
# the fleet by the "openclaw_ssh" play so the agent can run ssh/ansible/terraform.
# Public key only - safe to keep in plaintext, not vaulted. Revoke by removing
# this line from each host's authorized_keys.
openclaw_agent_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFkTNwLhJRYimENDF7UQUme/LnxtonUmm3V4mPZWGjxl mentor@openclaw.snorp.dev"

# Domain and network
base_domain: snorp.dev
vps_ip: 216.128.143.17
technitium_ip: 192.168.8.104
proxmox_ip: 192.168.8.187
nas_ip: 192.168.8.204
nas_smb_username: snorp
nas_smb_share: documents
provisioning_ip: 192.168.8.180
searxng_ip: 192.168.8.139
openclaw_ip: 192.168.8.140
hawkeye_ip: 192.168.8.113

# --- Outage monitor / ISP probe targets ---
# router LAN gateway (internal-alive anchor) - genuinely static
router_lan_ip: 192.168.8.1
# Public anchors for upstream/peering probe - static
public_anchors:
  - 1.1.1.1
  - 8.8.8.8
# NOTE: the Spectrum WAN gateway (currently 98.26.78.1) is NOT hardcoded.
# It is discovered dynamically as the first hop toward 1.1.1.1 (see hawkeye role).

# --- Alert delivery: Discord webhooks ---
# MIGRATED OFF ntfy 2026-07-10 (no phone app, works off-network). Alertmanager
# posts to Discord via native discord_configs. The two webhook URLs live in
# vault.yml (discord_outage_webhook / discord_logs_webhook) - they are secrets
# (anyone with the URL can post to the channel), so they are NOT committed here.
# They may point at the same channel/webhook or two separate ones.
#
# The old ntfy LXC (104), role, DNS record, and topic vars were removed
# 2026-07-10; nothing routes to ntfy anymore.

# --- Observability exporters (Proxmox + NAS) ---
# node_exporter + pve_exporter run on the Proxmox host; graphite_exporter runs
# on Hawkeye to receive TrueNAS Graphite pushes. Scraped by Prometheus.
pve_exporter_user: "monitoring@pve"
pve_exporter_token_name: "exporter"
# pve_exporter_token_secret is supplied via vault.yml (created on first run).
searxng_port: 8888
technitium_lxc_id: 100
provisioning_lxc_id: 101
searxng_lxc_id: 102

openclaw_searxng_url: "http://searx.snorp.dev:8888"

# Cert paths
certbot_cert_name: snorp.dev-0001
certbot_cert_dir: "/etc/letsencrypt/live/{{ certbot_cert_name }}"
cloudflare_ini_path: /root/.cloudflare.ini
proxmox_cert_dir: /etc/pve/local/certs
technitium_pfx_path: /etc/technitium/technitium.pfx

# Technitium
technitium_dns_records:
  - { name: "@",            type: A, value: "{{ vps_ip }}" }
  - { name: "www",          type: A, value: "{{ vps_ip }}" }
  - { name: "*",            type: A, value: "{{ vps_ip }}" }
  - { name: "technitium",   type: A, value: "{{ technitium_ip }}" }
  - { name: "proxmox",      type: A, value: "{{ proxmox_ip }}" }
  - { name: "provisioning", type: A, value: "{{ provisioning_ip }}" }
  - { name: "searx",        type: A, value: "{{ searxng_ip }}" }
  - { name: "openclaw",     type: A, value: "{{ openclaw_ip }}" }
  - { name: "nas",          type: A, value: "{{ nas_ip }}" }
  - { name: "hawkeye",      type: A, value: "{{ hawkeye_ip }}" }

technitium_forwarders:
  - https://cloudflare-dns.com/dns-query
  - https://dns.quad9.net/dns-query
  - https://dns.google/dns-query

# Block lists. Technitium's API takes blockListUrls as REPEATED form fields,
# one per URL - NOT a single newline-joined string. Joining with \n stores one
# mangled URL and silently disables all blocking. See technitium role.
technitium_blocklist_urls:
  - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/wildcard/multi-onlydomains.txt
